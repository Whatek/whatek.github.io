<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cienie Cytadeli</title>
  <style>
    body {
      margin: 0;
      font-family: 'Courier New', monospace;
      background-color: #111;
      color: #ccc;
      text-align: center;
      padding: 30px;
    }
    #main-button {
      padding: 20px 40px;
      font-size: 20px;
      background-color: #333;
      border: 2px solid #666;
      color: #eee;
      cursor: pointer;
    }
    #main-button:hover {
      background-color: #444;
    }
    .log {
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
      background-color: #1a1a1a;
      padding: 10px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <h1>Cienie Cytadeli</h1>
  <p>Mroczna Energia: <span id="energy">0</span></p>
  <button id="main-button">Przyzywaj Cienie</button>

  <div class="log" id="log"></div>

  <script>
    let energy = parseInt(localStorage.getItem('energy')) || 0;
    const energyDisplay = document.getElementById('energy');
    const log = document.getElementById('log');

    function logEvent(text) {
      const entry = document.createElement('div');
      entry.textContent = text;
      log.prepend(entry);
    }

    function updateEnergyDisplay() {
      energyDisplay.textContent = energy;
    }

    document.getElementById('main-button').addEventListener('click', () => {
      const gain = Math.floor(Math.random() * 3) + 1; // 1–3
      energy += gain;
      localStorage.setItem('energy', energy);
      updateEnergyDisplay();
      logEvent(`Zyskałeś ${gain} Mrocznej Energii.`);

      // RNG zdarzenie losowe (10% szans)
      if (Math.random() < 0.1) {
        const outcome = Math.random();
        if (outcome < 0.5) {
          logEvent('🧿 Artefakt: Znaleziono Starożytny Znak! (+5 Energii)');
          energy += 5;
        } else {
          logEvent('☠️ Klątwa: Cienie pochłonęły część twojej duszy... (-3 Energii)');
          energy = Math.max(0, energy - 3);
        }
        localStorage.setItem('energy', energy);
        updateEnergyDisplay();
      }
    });

    updateEnergyDisplay();
  </script>
</body>
</html>
